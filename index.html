<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12301f">
<meta name="description" content="Solitaire card games in the browser. Based on KDE KPatience.">
<title>KPat Web</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

<header class="toolbar">
<label class="sr-only" for="game-select">Hra</label>
<select id="game-select" aria-label="Hra"></select>

<button id="btn-new" type="button">Nová hra</button>
<button id="btn-restart" type="button">Restart</button>
<button id="btn-seed" type="button" title="Zadat číslo rozdání">#</button>
<button id="btn-undo" type="button" title="Zpět (Ctrl+Z)" disabled>Zpět</button>
<button id="btn-redo" type="button" title="Vpřed (Ctrl+Y)" disabled>Vpřed</button>
<button id="btn-hint" type="button" title="Tip (H)">Tip</button>
<button id="btn-redeal" type="button" hidden>Rozdat znovu</button>
<button id="btn-drop" type="button" title="Odložit karty na základny">Odložit</button>
<label class="toggle" title="Karty se samy odkládají na základny">
<input type="checkbox" id="opt-autodrop"> Auto-odkládání
</label>

<span class="spacer"></span>

<div class="info" aria-live="off">
<span>Tahy: <span id="moves">0</span></span>
<span>Rozdání: <span id="seed">#0</span></span>
<span id="score-box" hidden>Body: <span id="score">0</span> · Kolo: <span id="round">1</span>/<span id="rounds">3</span></span>
</div>
</header>

<div class="statusbar">
<div id="stats"></div>
<div id="status" role="status" aria-live="polite"></div>
</div>

<main class="board-wrap">
<div id="board" class="board" aria-label="Herní plocha"></div>
<noscript>Pro hraní je potřeba JavaScript.</noscript>
</main>

<footer class="footer">
Webová verze odvozená z
<a href="https://github.com/KDE/kpat" rel="noopener">KDE KPatience</a>.
Licence: GNU GPL v2 nebo novější. Zdrojový kód je dostupný v repozitáři projektu.
</footer>

</div>

<dialog id="win-dialog" aria-labelledby="win-title">
<h2 id="win-title">Gratulujeme!</h2>
<p id="win-text"></p>
<p id="win-stats"></p>
<button id="win-new" type="button">Nová hra</button>
</dialog>

<script>
(function () {
    function banner(msg) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;' +
        'background:#7f1d1d;color:#fff;padding:10px 14px;font:14px/1.4 monospace;white-space:pre-wrap';
        d.textContent = msg;
        document.body.appendChild(d);
    }
    window.__banner = banner;
    if (location.protocol === 'file:') {
        banner('Stránka je otevřena přes file://, moduly ES se tak nenačtou.\n' +
        'Spusťte v kořeni projektu: python3 -m http.server 8000\n' +
        'a otevřete http://localhost:8000');
    }
    window.addEventListener('error', function (e) {
        banner('Chyba: ' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
        banner('Chyba (promise): ' + ((e.reason && e.reason.message) || e.reason));
    });
})();
</script>
<script type="module" src="src/main.js"
onerror="__banner('Nepodařilo se načíst src/main.js nebo některý z jeho importů. Otevřete konzoli (F12) a zkontrolujte první červenou chybu.')"></script>
</body>
</html>
