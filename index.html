<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<meta name="description" content="Solitaire card games in the browser. Based on KDE KPatience.">
<title>KPat Web</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

<header class="toolbar">
<div class="select" id="game-select">
<span class="sr-only" id="game-select-caption">Game</span>
<button type="button" class="select-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="game-select-menu" aria-labelledby="game-select-caption game-select-label">
<span class="select-label" id="game-select-label"></span>
<svg class="select-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5 10 13 15 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<ul class="select-menu" id="game-select-menu" role="listbox" aria-label="Game" hidden></ul>
</div>

<button id="btn-new" type="button">New Game</button>
<button id="btn-restart" type="button">Restart</button>
<button id="btn-seed" type="button" title="Enter deal number">#</button>
<button id="btn-undo" type="button" title="Undo (Ctrl+Z)" disabled>Undo</button>
<button id="btn-redo" type="button" title="Redo (Ctrl+Y)" disabled>Redo</button>
<button id="btn-hint" type="button" title="Hint (H)">Hint</button>
<button id="btn-redeal" type="button" hidden>Redeal</button>
<button id="btn-end" type="button" title="End the game now and lock in your current score" hidden>End Game</button>
<button id="btn-rules" type="button" title="How to play this game">Rules</button>
<label class="toggle" title="Cards are automatically played to the foundations">
<input type="checkbox" id="opt-autodrop"> Auto-collect
</label>

<span class="spacer"></span>

<button id="btn-theme" type="button" title="Theme: matching system">◐</button>
<button id="btn-fullscreen" type="button" title="Full screen">⛶</button>

<div class="info" aria-live="off">
<span>Moves: <span id="moves">0</span></span>
<span>Deal: <span id="seed">#0</span></span>
<span id="score-box" hidden>Score: <span id="score">0</span><span id="round-info"> · Round: <span id="round">1</span>/<span id="rounds">3</span></span></span>
</div>
</header>

<div class="main-col">

<div class="statusbar">
<div id="stats"></div>
<div id="status" role="status" aria-live="polite"></div>
</div>

<main class="board-wrap">
<div id="board" class="board" aria-label="Game board"></div>
<noscript>JavaScript is required to play.</noscript>
</main>

<footer class="footer">
A web version derived from
<a href="https://github.com/KDE/kpat" rel="noopener">KDE KPatience</a>.
License: GNU GPL v2 or later. Source code is available in the <a href="https://github.com/letress/opencardgames" rel="noopener">project repository</a>.
</footer>

</div>

</div>

<dialog id="win-dialog" aria-labelledby="win-title">
<h2 id="win-title">Congratulations!</h2>
<p id="win-text"></p>
<p id="win-stats"></p>
<button id="win-new" type="button">New Game</button>
</dialog>

<dialog id="rules-dialog" aria-labelledby="rules-title">
<h2 id="rules-title"></h2>
<div id="rules-body" class="rules-body"></div>
<button id="rules-close" type="button">Close</button>
</dialog>

<script>
(function () {
    function banner(msg) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;' +
        'background:#7f1d1d;color:#fff;padding:10px 14px;font:14px/1.4 monospace;white-space:pre-wrap';
        d.textContent = msg;
        document.body.appendChild(d);
    }
    window.__banner = banner;
    if (location.protocol === 'file:') {
        banner('This page was opened via file://, so ES modules will not load.\n' +
        'Run this in the project root: python3 -m http.server 8000\n' +
        'and open http://localhost:8000');
    }
    window.addEventListener('error', function (e) {
        banner('Error: ' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
        banner('Error (promise): ' + ((e.reason && e.reason.message) || e.reason));
    });
})();
</script>
<script type="module" src="src/main.js"
onerror="__banner('Failed to load src/main.js or one of its imports. Open the console (F12) and check the first red error.')"></script>
</body>
</html>
